<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Blå till grön gradient -->
    <linearGradient id="bokixGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="50%" stop-color="#00B894" />
      <stop offset="100%" stop-color="#88D43B" />
    </linearGradient>
  </defs>

  <!-- Bakgrundscirkel -->
  <circle cx="250" cy="250" r="220" fill="url(#bokixGradient)" />

  <!-- Text: Bokix -->
  <text
    x="50%"
    y="54%"
    font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="110"
    font-weight="900"
    fill="#FFFFFF"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-2">
    Bokix
  </text>
</svg>
