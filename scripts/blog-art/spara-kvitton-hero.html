<!doctype html><html lang="sv"><head><meta charset="utf-8"><link rel="stylesheet" href="cover.css"><style>
.art { background: #f2e8d5; }
.r { width: 170px; padding: 20px 16px 30px; color: #444; font-size: 13px; border-radius: 2px; }
.r .h { height: 12px; width: 70%; margin: 0 auto 14px; background: #555; opacity: 0.6; border-radius: 3px; }

.box .front { position: absolute; inset: 0; background: #b98552; border-radius: 6px; }

.box .tag span { font-size: 18px; font-weight: 600; }

.phone { left: 880px; top: 120px; width: 200px; height: 400px; border-radius: 34px; background: #2a2622; padding: 10px; transform: rotate(10deg); box-shadow: 0 30px 50px -26px rgba(0,0,0,0.5); }

</style></head><body><div class="art">
