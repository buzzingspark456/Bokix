<!doctype html><html lang="sv"><head><meta charset="utf-8"><link rel="stylesheet" href="cover.css"><style>
.art { background: #cfe2f3; }
.cal { left: 170px; top: 110px; width: 380px; height: 420px; border-radius: 16px; overflow: hidden; transform: rotate(-5deg); box-shadow: 0 30px 50px -26px rgba(20,40,80,0.45); background: #fffdf8; text-align: center; color: #1d2b44; }
.cal .top { height: 110px; background: #d8473a; color: #fff; font-size: 40px; font-weight: 800; letter-spacing: 0.14em; display: flex; align-items: center; justify-content: center; }
.cal .rings { position: absolute; top: -14px; left: 0; right: 0; display: flex; justify-content: space-around; padding: 0 70px; }
.cal .rings i { width: 18px; height: 44px; border-radius: 9px; background: #44516b; }
.cal .num { font-family: Georgia, serif; font-size: 190px; font-weight: 700; line-height: 1; margin-top: 30px; }
.cal .day { font-size: 24px; font-weight: 600; color: #6b7891; margin-top: 8px; }
.form { left: 640px; top: 90px; width: 400px; height: 470px; padding: 36px 34px; transform: rotate(3deg); color: #1d2b44; }
.form h4 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
.form .sub { font-size: 15px; color: #6b7891; margin-bottom: 22px; }
.rr { display: flex; align-items: center; gap: 14px; height: 54px; border-top: 1.5px solid #e6e0d2; }
.rr .n { width: 46px; height: 34px; border: 2px solid #1d2b44; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
.rr .bar { flex: 1; height: 10px; border-radius: 5px; background: #dde6f1; }
.rr .v { font-size: 21px; color: #1f4fb5; width: 96px; text-align: right; }
</style></head><body><div class="art">
<div class="abs cal"><div class="top">FEB</div><div class="num">12</div><div class="day">torsdag</div></div>
<div class="abs cal" style="background:none;box-shadow:none;overflow:visible"><div class="rings"><i></i><i></i></div></div>
<div class="abs form paper">
  <h4>Momsdeklaration</h4>
  <div class="sub">Okt – dec 2025</div>
  <div class="rr"><span class="n">05</span><span class="bar"></span><span class="v hand">48 000</span></div>
  <div class="rr"><span class="n">10</span><span class="bar"></span><span class="v hand">12 000</span></div>
  <div class="rr"><span class="n">48</span><span class="bar"></span><span class="v hand">3 150</span></div>
  <div class="rr"><span class="n">49</span><span class="bar"></span><span class="v hand">8 850</span></div>
</div>
<div class="grain"></div>
</div></body></html>
