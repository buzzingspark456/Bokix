<!doctype html><html lang="sv"><head><meta charset="utf-8"><link rel="stylesheet" href="cover.css"><style>
.art { background: #3d4a57; }
.safe { left: 330px; top: 90px; width: 440px; height: 450px; background: #9aa7b3; border-radius: 22px; box-shadow: 0 40px 60px -30px rgba(0,0,0,0.6); }
.safe .in { position: absolute; left: 34px; top: 34px; right: 34px; bottom: 34px; background: #26303a; border-radius: 10px; }
.binder { position: absolute; bottom: 24px; width: 70px; height: 300px; border-radius: 6px; }
.binder::after { content: ''; position: absolute; left: 14px; right: 14px; top: 40px; height: 90px; background: #fffdf8; border-radius: 3px; }
.door { left: 760px; top: 90px; width: 230px; height: 450px; background: #b9c4ce; border-radius: 0 22px 22px 0; transform: perspective(900px) rotateY(-38deg); transform-origin: left center; box-shadow: 0 40px 60px -30px rgba(0,0,0,0.6); }
.door .wheel { position: absolute; left: 70px; top: 170px; width: 100px; height: 100px; border-radius: 50%; border: 10px solid #7d8a96; }
.door .wheel::before, .door .wheel::after { content: ''; position: absolute; left: 35px; top: -10px; width: 10px; height: 100px; background: #7d8a96; }
.door .wheel::after { transform: rotate(90deg); }
.tag { left: 150px; top: 330px; width: 150px; height: 150px; background: #f6d36b; transform: rotate(-7deg); display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-size: 50px; font-weight: 700; color: #3d4a57; box-shadow: 0 22px 30px -20px rgba(0,0,0,0.5); }
</style></head><body><div class="art">
<div class="abs safe"><div class="in">
  <div class="binder" style="left:40px;background:#e07a5f"></div>
  <div class="binder" style="left:120px;background:#6fa58b"></div>
  <div class="binder" style="left:200px;background:#5f87c6"></div>
  <div class="binder" style="left:280px;background:#d9a441;transform:rotate(8deg);transform-origin:bottom left"></div>
</div></div>
<div class="abs door"><div class="wheel"></div></div>
<div class="abs tag hand">7 år</div>
<div class="grain"></div>
</div></body></html>
