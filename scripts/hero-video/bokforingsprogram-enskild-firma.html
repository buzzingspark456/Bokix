<!doctype html><html lang="sv"><head><meta charset="utf-8"><link rel="stylesheet" href="scene.css"><style>
/* Enskild firma: kvittot läses av, och NE-bilagan fylls i med förslag ur bokföringen. */
.stage { background: #f2e3c4; }
.rcpt { left: 110px; top: 120px; width: 270px; padding: 30px 28px 34px; transform: rotate(-5deg); font-size: 17px; }
.rcpt .r { display: flex; justify-content: space-between; padding: 8px 0; }
.scan { left: 96px; top: 150px; width: 300px; height: 34px; background: linear-gradient(180deg, transparent, rgba(31,122,74,0.45), transparent); }
@keyframes scan { 0% { opacity: 0; transform: translateY(0) rotate(-5deg); } 2% { opacity: 1; } 16% { opacity: 1; transform: translateY(300px) rotate(-5deg); } 18% { opacity: 0; transform: translateY(300px) rotate(-5deg); } 100% { opacity: 0; } }
.arrow { left: 418px; top: 300px; }
.ne { left: 500px; top: 150px; width: 380px; padding: 32px 32px 30px; transform: rotate(3deg); }
.ne h4 { font-family: Georgia, serif; font-size: 36px; font-weight: 700; }
.row { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; padding: 13px 0; border-top: 2px solid #efe8da; }
.row .code { font-size: 14px; font-weight: 800; color: #6b7f74; margin-right: 10px; }
.tot { font-size: 21px; font-weight: 800; border-top: 3px solid #1d2b23; }
</style></head><body><div class="stage"><div class="scene">
<div class="abs paper rcpt a mono" style="animation-name: rise; animation-delay: 0.2s">
  <div style="text-align: center; font-weight: 700; font-size: 19px; margin-bottom: 14px">KONTORSBUTIKEN</div>
  <div class="r"><span>Skrivare</span><span>1 990</span></div>
  <div class="r"><span>Papper</span><span>249</span></div>
  <div class="r" style="border-top: 2px dashed #cfc6b3; margin-top: 8px; padding-top: 14px; font-weight: 700"><span>TOTALT</span><span>2 239</span></div>
  <div class="r muted"><span>varav moms</span><span>448</span></div>
</div>
<div class="abs scan a" style="animation-name: scan; animation-delay: 0.9s"></div>
<div class="abs a" style="left: 140px; top: 520px; animation-name: pop; animation-delay: 2.6s"><span class="chip"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Bokförd på 5410</span></div>
<div class="abs arrow a" style="animation-name: fadein; animation-delay: 3.2s"><svg width="64" height="40" viewBox="0 0 64 40"><path d="M4 20h50M40 6l16 14-16 14" fill="none" stroke="#1d2b23" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/></svg></div>
<div class="abs paper ne a" style="animation-name: slide; animation-delay: 3.6s">
  <div class="label">Förslag ur bokföringen</div>
  <h4 style="margin: 6px 0 18px">NE-bilaga</h4>
  <div class="row a" style="animation-name: fadein; animation-delay: 4.4s"><span><span class="code">R1</span>Försäljning</span><b>412 000</b></div>
  <div class="row a" style="animation-name: fadein; animation-delay: 4.9s"><span><span class="code">R6</span>Övriga kostnader</span><b>−86 300</b></div>
  <div class="row a" style="animation-name: fadein; animation-delay: 5.4s"><span><span class="code">R10</span>Avskrivningar</span><b>−13 300</b></div>
  <div class="row tot a" style="animation-name: fadein; animation-delay: 5.9s"><span>Överskott</span><span>312 400</span></div>
</div>
<div class="abs a" style="left: 600px; top: 600px; animation-name: pop; animation-delay: 6.8s"><span class="chip"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Till din deklaration</span></div>
</div><div class="grain"></div></div></body></html>
