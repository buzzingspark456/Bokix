<!doctype html><html lang="sv"><head><meta charset="utf-8"><link rel="stylesheet" href="scene.css"><style>
/* Alternativ till Fortnox: en SIE4-fil flyttar från det gamla programmet till Bokix, och allt bockas av. */
.stage { background: #ddd6f3; }
.old { left: 80px; top: 110px; width: 330px; height: 260px; padding: 28px; transform: rotate(-3deg); }
.folder { width: 120px; height: 86px; border-radius: 10px; background: #b9aee0; position: relative; margin-top: 18px; }
.folder::before { content: ''; position: absolute; left: 0; top: -14px; width: 54px; height: 20px; border-radius: 8px 8px 0 0; background: #b9aee0; }
.file { left: 200px; top: 200px; width: 110px; height: 136px; border-radius: 10px; background: #fffdf8; box-shadow: 0 18px 26px -14px rgba(40,20,80,0.55); padding: 16px 14px; }
.file b { display: inline-block; font-size: 15px; font-weight: 800; color: #fff; background: #7c3aed; border-radius: 6px; padding: 4px 8px; }
@keyframes move { 0% { transform: none; } 5% { transform: translate(200px, -170px) rotate(-10deg); } 11% { transform: translate(480px, -60px) rotate(4deg) scale(0.92); } 12.5% { transform: translate(480px, -60px) scale(0.6); opacity: 1; } 13.5% { opacity: 0; transform: translate(480px, -60px) scale(0.5); } 100% { opacity: 0; transform: translate(480px, -60px) scale(0.5); } }
.bokix { left: 590px; top: 100px; width: 280px; height: 220px; border-radius: 40px; background: #fffdf8; display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 44px -24px rgba(40,20,80,0.5); transform: rotate(4deg); }
.list { left: 240px; top: 420px; width: 470px; padding: 22px 26px; transform: rotate(-2deg); }
.it { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 2px solid #efe8da; font-size: 20px; }
.it:first-of-type { border-top: 0; }
.tick { width: 30px; height: 30px; border-radius: 50%; background: #1f7a4a; display: inline-flex; align-items: center; justify-content: center; margin-left: 14px; vertical-align: middle; }
</style></head><body><div class="stage"><div class="scene">
<div class="abs paper old a" style="animation-name: rise; animation-delay: 0.2s"><div class="label">Ditt gamla program</div><div class="folder"></div></div>
<div class="abs a" style="left: 0; top: 0; animation-name: fadein; animation-delay: 0.8s"><div class="abs file a" style="animation-name: move; animation-delay: 1.6s"><b>SIE4</b><div class="ln" style="margin-top: 16px; width: 70px"></div><div class="ln" style="margin-top: 10px; width: 56px"></div><div class="ln" style="margin-top: 10px; width: 64px"></div></div></div>
<div class="abs bokix a" style="animation-name: pulse; animation-delay: 2.6s"><svg viewBox="0 0 125 40" style="width: 190px"><defs><linearGradient id="wm" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="50%" stop-color="#14b8a6"/><stop offset="100%" stop-color="#84cc16"/></linearGradient></defs><path d="{{WORDMARK_PATH}}" fill="url(#wm)"/></svg></div>
<div class="abs paper list a" style="animation-name: rise; animation-delay: 3s">
  <div class="it">Konton <span><b>312</b><span class="tick a" style="animation-name: pop; animation-delay: 3.6s"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span></div>
  <div class="it">Verifikationer <span><b>1 248</b><span class="tick a" style="animation-name: pop; animation-delay: 4.1s"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span></div>
  <div class="it">Ingående balanser <span><span class="tick a" style="animation-name: pop; animation-delay: 4.6s"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span></div>
</div>
<div class="abs a" style="left: 590px; top: 650px; animation-name: pop; animation-delay: 5.4s"><span class="chip">Flyttat till Bokix</span></div>
</div><div class="grain"></div></div></body></html>
