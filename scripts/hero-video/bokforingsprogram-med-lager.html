<!doctype html><html lang="sv"><head><meta charset="utf-8"><link rel="stylesheet" href="scene.css"><style>
/* Lager: tre kartonger landar på hyllan, lagervärdet räknas upp, en kartong säljs och värdet sjunker. */
.stage { background: #f3e3c4; }
.floor { left: 70px; top: 642px; width: 520px; height: 10px; border-radius: 5px; background: #d9c39b; }
.box { width: 190px; height: 150px; border-radius: 12px; box-shadow: 0 26px 30px -20px rgba(70,45,10,0.55); }
.box::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 36px; margin-left: -18px; background: rgba(255,255,255,0.3); }
.box .tag { position: absolute; left: 18px; bottom: 18px; background: #fffdf8; border-radius: 6px; padding: 6px 10px; font-size: 15px; font-weight: 700; }
@keyframes drop { 0% { opacity: 1; transform: translateY(-640px); } 5% { transform: translateY(0); animation-timing-function: ease-out; } 6.5% { transform: translateY(-24px); animation-timing-function: ease-in; } 8% { transform: translateY(0); } 100% { transform: translateY(0); } }
@keyframes sold { 0% { transform: none; opacity: 1; } 7% { transform: translateX(560px) rotate(6deg); opacity: 1; } 8% { opacity: 0; } 100% { opacity: 0; transform: translateX(560px); } }
.val { left: 610px; top: 130px; width: 290px; padding: 26px 28px; transform: rotate(3deg); }
.v { position: absolute; left: 28px; top: 62px; font-family: Georgia, serif; font-size: 48px; font-weight: 700; opacity: 0; font-variant-numeric: tabular-nums; }
@keyframes v0 { 0%, 9.9% { opacity: 1; } 10%, 100% { opacity: 0; } }
@keyframes v1 { 0%, 9.9% { opacity: 0; } 10%, 16.9% { opacity: 1; } 17%, 100% { opacity: 0; } }
@keyframes v2 { 0%, 16.9% { opacity: 0; } 17%, 23.9% { opacity: 1; } 24%, 100% { opacity: 0; } }
@keyframes v3 { 0%, 23.9% { opacity: 0; } 24%, 54.9% { opacity: 1; } 55%, 100% { opacity: 0; } }
@keyframes v4 { 0%, 54.9% { opacity: 0; } 55%, 100% { opacity: 1; } }
.v0 { animation: v0 10s linear both; } .v1 { animation: v1 10s linear both; } .v2 { animation: v2 10s linear both; } .v3 { animation: v3 10s linear both; } .v4 { animation: v4 10s linear both; }
</style></head><body><div class="stage"><div class="scene">
<div class="abs floor"></div>
<div class="abs a" style="left: 90px; top: 492px; animation-name: drop; animation-delay: 0.4s"><div class="box" style="position: relative; background: #c99a5e"><span class="tag">Kaffebönor</span></div></div>
<div class="abs a" style="left: 300px; top: 492px; animation-name: drop; animation-delay: 1.1s"><div class="box" style="position: relative; background: #bd8f55"><span class="tag">Kvarnar</span></div></div>
<div class="abs a" style="left: 195px; top: 336px; animation-name: drop; animation-delay: 1.8s"><div class="a" style="animation-name: sold; animation-delay: 5s"><div class="box" style="position: relative; background: #d3a76b"><span class="tag">Filter</span></div></div></div>
<div class="abs a" style="left: 610px; top: 420px; animation-name: pop; animation-delay: 5.6s"><span class="chip" style="background: #b45309">Såld på faktura 1013</span></div>
<div class="abs paper val a" style="animation-name: slide; animation-delay: 0.2s; height: 220px">
  <div class="label">Lagervärde</div>
  <div class="v v0">0 kr</div><div class="v v1">7 440 kr</div><div class="v v2">14 880 kr</div><div class="v v3">22 400 kr</div><div class="v v4">14 880 kr</div>
  <div class="a" style="position: absolute; left: 28px; bottom: 26px; animation-name: pop; animation-delay: 2.6s"><span style="font-size: 16px; font-weight: 800; color: #1f7a4a; background: #e3f2e8; border-radius: 999px; padding: 6px 14px">FIFO</span></div>
</div>
</div><div class="grain"></div></div></body></html>
