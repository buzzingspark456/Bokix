<!doctype html><html lang="sv"><head><meta charset="utf-8"><link rel="stylesheet" href="scene.css"><style>
/* Nystartat: organisationsnumret skrivs in, uppgifterna hämtas och kalendern visar dag 1. */
.stage { background: #f7d3d9; }
.field { left: 90px; top: 100px; width: 470px; padding: 26px 28px; transform: rotate(-2deg); }
.input { margin-top: 12px; height: 70px; border: 3px solid #1d2b23; border-radius: 12px; display: flex; align-items: center; padding: 0 18px; font-size: 34px; font-weight: 700; letter-spacing: 0.04em; }
.typed { display: inline-block; overflow: hidden; white-space: nowrap; width: 0; animation: type 10s both; animation-delay: 0.6s; }
@keyframes type { 0% { width: 0; animation-timing-function: steps(11, end); } 16% { width: calc(11ch + 0.5em); } 100% { width: calc(11ch + 0.5em); } }
.typed { animation-timing-function: steps(11, end); }
.caret { display: inline-block; width: 3px; height: 38px; background: #1d2b23; margin-left: 3px; animation: blink 10s step-end both; }
@keyframes blink { 0%, 25% { opacity: 1; } 27%, 100% { opacity: 0; } }
.btn { margin-top: 18px; height: 58px; border-radius: 12px; background: #1d2b23; color: #fff; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.co { left: 300px; top: 380px; width: 460px; padding: 28px 30px; transform: rotate(2deg); }
.r { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-top: 2px solid #efe8da; font-size: 20px; }
.cal { left: 680px; top: 110px; width: 190px; height: 200px; border-radius: 22px; overflow: hidden; background: #fffdf8; box-shadow: 0 30px 44px -24px rgba(80,20,30,0.5); transform: rotate(6deg); text-align: center; }
.cal .top { background: #e2553f; color: #fff; font-size: 22px; font-weight: 800; letter-spacing: 0.1em; padding: 12px 0; }
@keyframes drop { 0% { opacity: 0; transform: translateY(-420px); } 1% { opacity: 1; } 5% { transform: translateY(0); animation-timing-function: ease-out; } 6.5% { transform: translateY(-20px); animation-timing-function: ease-in; } 8% { transform: translateY(0); } 100% { opacity: 1; transform: translateY(0); } }
.dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; }
@keyframes burst { 0% { opacity: 0; transform: translate(0, 0) scale(0.4); } 1% { opacity: 1; } 8% { opacity: 1; transform: translate(var(--x), var(--y)) scale(1); } 12% { opacity: 0; transform: translate(var(--x), calc(var(--y) + 40px)) scale(0.8); } 100% { opacity: 0; } }
</style></head><body><div class="stage"><div class="scene">
<div class="abs paper field a" style="animation-name: rise; animation-delay: 0.1s">
  <div class="label">Organisationsnummer</div>
  <div class="input mono"><span class="typed">559123-4567</span><span class="caret"></span></div>
  <div class="btn a" style="animation-name: press; animation-delay: 2.4s">Hämta uppgifter</div>
</div>
<div class="abs paper co a" style="animation-name: rise; animation-delay: 2.9s">
  <div class="serif" style="font-size: 34px; font-weight: 700; margin-bottom: 10px">Exempelbygg AB</div>
  <div class="r a" style="animation-name: fadein; animation-delay: 3.4s"><span>Bolagsform</span><b>Aktiebolag</b></div>
  <div class="r a" style="animation-name: fadein; animation-delay: 3.8s"><span>Räkenskapsår</span><b>Kalenderår</b></div>
  <div class="r a" style="animation-name: fadein; animation-delay: 4.2s"><span>Momsperiod</span><b>Kvartal</b></div>
</div>
<div class="abs a" style="left: 680px; top: 110px; animation-name: drop; animation-delay: 5s"><div class="cal" style="position: relative; left: 0; top: 0"><div class="top">OKT</div><div class="serif" style="font-size: 100px; font-weight: 700; line-height: 1.3">1</div></div></div>
<div class="abs" style="left: 775px; top: 210px">
  <i class="dot a" style="background: #1f7a4a; --x: -150px; --y: -90px; animation-name: burst; animation-delay: 5.5s"></i>
  <i class="dot a" style="background: #0ea5e9; --x: 140px; --y: -110px; animation-name: burst; animation-delay: 5.55s"></i>
  <i class="dot a" style="background: #f0b55a; --x: -120px; --y: 110px; animation-name: burst; animation-delay: 5.6s"></i>
  <i class="dot a" style="background: #e2553f; --x: 130px; --y: 120px; animation-name: burst; animation-delay: 5.5s"></i>
  <i class="dot a" style="background: #8b5cf6; --x: 10px; --y: -170px; animation-name: burst; animation-delay: 5.65s"></i>
</div>
<div class="abs a" style="left: 640px; top: 650px; animation-name: pop; animation-delay: 6s"><span class="chip">Klart att bokföra</span></div>
</div><div class="grain"></div></div></body></html>
