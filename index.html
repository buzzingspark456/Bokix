<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <!-- Måste vara FÖRSTA elementet i <head> efter charset — den ska sätta
         data-theme (och de två syskonattributen) på <html> innan
         webbläsaren hinner måla något alls, annars blinkar sidan förbi i
         ljust läge vid varje omladdning i mörkt läge. Se filens egen
         kommentar (public/theme-init.js) för varför den är en extern fil
         och inte ett inline-script. -->
    <script src="/theme-init.js"></script>
    <!-- Google Search Console-ägarverifiering (HTML-tagg-metoden) — bevisar
         att den här sajten faktiskt är bokix.se inför Google, krävs innan
         sitemapen (public/sitemap.xml) kan skickas in. Ta ALDRIG bort utan
         att verifiera i Search Console om domänen behöver verifieras om. -->
    <meta name="google-site-verification" content="3y6QgWaWZDle_daSlZfCE4BVn-nh6H-YSNOEsgfWJ-8" />
    <meta name="msvalidate.01" content="371B01F33735D03213592F96F0800BE4" />
    <!-- Google Search favicon-riktlinjer: minst 48×48, helst en multipel av
         48 — Google stödjer INTE SVG som favicon-format alls (till skillnad
         från webbläsare), och de äldre 16/32px-varianterna längre ner är
         för små för att Google ska plocka upp dem i sökresultatet (skärm-
         dumpen visade bara en generisk jordglob istället för Bokix egen
         logga). PNG ≥48px läggs därför FÖRST — Google använder den första
         ikonen den faktiskt stödjer i listan, inte nödvändigtvis den
         "bästa". "-v2"-suffixet på filnamnen är medvetet: samma innehåll
         som de gamla (icke-v2) filerna, men ett nytt filnamn tvingar
         Googles favicon-cache att hämta om istället för att fortsätta
         servera en gammal, cachad ikon under samma URL. Kräver ändå ett
         manuellt "Begär indexering" i Search Console efter deploy — annars
         kan omcrawlningen ta veckor på egen hand. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48-v2.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96-v2.png" />
    <link rel="icon" type="image/x-icon" href="/favicon-v2.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Bokix som app på hemskärmen (se /lagg-till-pa-hemskarmen): manifestet
         ger namn, ikon och helskärm på Android; taggarna nedan gör samma sak
         på iPhone. start_url /?app=1 öppnar appen direkt (se AppRouter.jsx). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bokix" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Statusfältets färg i appen på hemskärmen (Android) och webbläsarens
         ram: samma som appens bakgrund (--bg-page), så toppen av skärmen
         flyter ihop med appen i stället för att vara en mörkgrön rand.
         App.jsx byter värde när man väljer ljust/mörkt läge själv. -->
    <meta name="theme-color" content="#f4f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1a13" media="(prefers-color-scheme: dark)" />
    <!-- Kundfeedback ("no zooming ... mobile apps ser perfekta ut, inte
         zoombara"): maximum-scale=1 + user-scalable=no stänger av pinch-/
         dubbeltrycks-zoom PÅ SIDAN, samma känsla som en riktig nativ app.
         iOS Safari (10+) respekterar detta ändå fortfarande INTE för sin
         egen SYSTEM-tillgänglighetszoom (trepunktstryck/förstoringsglas i
         Inställningar) — den funkar oavsett, så ingen med den funktionen
         påslagen förlorar något.

         Bugkritiskt (hittat under just den här felsökningen, se PRODUCTION
         READINESS-anteckningarna/commit-historiken för detaljer): en
         HTML-kommentar avslutas med bindestreck-bindestreck-större-än,
         INTE CSS/JS-syntaxens asterisk-snedstreck. Ett första försök att
         skriva just den här kommentaren använde av misstag fel
         avslutningstecken, vilket gjorde att webbläsaren aldrig såg
         kommentaren som klar och tyst svalde HELA viewport-metataggen
         (och allt annat fram till nästa riktiga avslutning längre ner i
         filen) som kommentartext. Resultatet: en sökning efter
         viewport-metataggen i DOM:en gav ingenting, och mobila
         webbläsare föll tillbaka på sin breda "desktop"-layoutviewport
         och skalade ner HELA sidan — den bakomliggande orsaken till
         praktiskt taget alla "sidan är för stor/känns inte stabil på
         mobilen"-symptom, inte bara en kosmetisk detalj. Skriv ALDRIG en
         bokstavlig avslutningssekvens rakt in i kommentartexten här igen
         (som just orsakade en ANDRA, identisk incident under samma
         felsökning) — beskriv den, återge den aldrig. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Bas-fallback för Open Graph/Twitter Card — täcker sidor som ännu
         inte satt egna taggar (t.ex. /privacy, /terms) samt det korta
         ögonblicket innan React hunnit montera och (för de fem marknads-
         sidorna) skriva över med sina egna via <PageMeta>, se
         src/utils/seo.jsx. React 19 hissar title/meta/link till <head> när
         de renderas i komponentträdet och skriver då över dessa på
         KLIENTEN — men scripts/prerender.mjs (SSG-byggsteget, körs efter
         `vite build`) ersätter hela blocket mellan markörerna nedan
         DIREKT I HTML:EN för de sex förrenderade marknadssidorna, så en
         crawler som aldrig kör JS ser rätt titel/beskrivning också. Rör
         ALDRIG start-/slutmarkörerna (BOKIX_SEO_META_START/END) — prerender-
         scriptet letar efter dem exakt. -->
    <!-- BOKIX_SEO_META_START -->
    <meta name="description" content="Bokix - Ett modernt, enkelt och kraftfullt bokföringsprogram för svenska företag i alla bolagsformer." />
    <title>Bokix - Smart & Enkel Bokföring online</title>
    <link rel="canonical" href="https://www.bokix.se/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bokix" />
    <meta property="og:title" content="Bokix - Smart & Enkel Bokföring online" />
    <meta property="og:description" content="Bokix - Ett modernt, enkelt och kraftfullt bokföringsprogram för svenska företag i alla bolagsformer." />
    <meta property="og:url" content="https://www.bokix.se/" />
    <meta property="og:image" content="https://www.bokix.se/og-image.png" />
    <meta property="og:locale" content="sv_SE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bokix - Smart & Enkel Bokföring online" />
    <meta name="twitter:description" content="Bokix - Ett modernt, enkelt och kraftfullt bokföringsprogram för svenska företag i alla bolagsformer." />
    <meta name="twitter:image" content="https://www.bokix.se/og-image.png" />
    <!-- BOKIX_SEO_META_END -->
    <!-- Google Fonts som en riktig <link> med crossorigin, INTE ett @import
         i index.css — ett cross-origin @import gör att html2canvas (faktura-
         PDF/mejl-export) kastar en SecurityError när den försöker läsa
         stylesheetens cssRules, vilket i praktiken slog ut ALL styling från
         resten av index.css (samma fil) i den exporterade PDF:en/mejlbilagan,
         inte bara typsnittet. Googles /css2-endpoint skickar
         Access-Control-Allow-Origin, så en <link crossorigin> går att läsa
         utan att kasta. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Lighthouse (Prestanda, "Begäranden om renderingsblockering"): en
         vanlig <link rel="stylesheet"> här blockerar första målningen tills
         Google Fonts svarat. `media="print"` gör att webbläsaren laddar
         hem den PARALLELLT utan att blockera renderingen; /font-swap.js
         byter den till `all` så den faktiskt appliceras så fort den är
         klar — texten syns direkt i systemfallback-typsnittet
         (`&display=swap` i URL:en) och byter till Inter utan blockering.
         ETT inline onload="..."-attribut hade gjort exakt samma sak men
         bryter mot Content-Security-Policyn (vercel.json script-src har
         ingen 'unsafe-inline') — därav ett externt script istället, se
         dess egen kommentar, samma mönster som consent-init.js redan
         använder av samma skäl. `crossorigin` följer med rakt av så
         html2canvas fortfarande kan läsa cssRules utan SecurityError, se
         kommentaren ovan — bara LADDNINGEN är asynkron, inte CORS-
         beteendet. <noscript>-fallbacken täcker webbläsare utan JS
         (font-swap.js körs aldrig då). -->
    <link
      data-font-async
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet" crossorigin="anonymous" media="print"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" crossorigin="anonymous" />
    </noscript>
    <script src="/font-swap.js" defer></script>

    <!-- Google Analytics via Consent Mode v2 (Sida 37). Bugkritiskt: consent
         'default' med samtliga kategorier 'denied' MÅSTE köras innan 'config'
         — annars sätter gtag.js _ga/_gid-cookies och skickar mätdata redan
         vid sidladdning, innan besökaren hunnit svara i cookiebannern
         (src/components/CookieBanner.jsx), vilket bryter mot GDPR/ePrivacy.
         Bannern anropar gtag('consent','update',...) via
         src/utils/consent.js när besökaren faktiskt väljer.

         Själva gtag.js-scriptet (tidigare en egen <script async src="…">
         här) är flyttat IN i consent-init.js och fördröjt (Lighthouse:
         163.8 KiB, den största "oanvänd JavaScript"-posten) — se den
         filens egen kommentar för hela resonemanget och varför
         konsent-ordningen fortfarande garanterat håller.

         Extern fil, inte inline — se public/consent-init.js för varför
         (Content-Security-Policy, säkerhetsgranskningen).

         `defer` (Lighthouse, "Undvik renderingsblockerande resurser" —
         riktig PageSpeed Insights-mätning: 3,9 KiB/~120ms här): scriptet gör
         bara kö-push-anrop (dataLayer.push/c[a].q.push, se dess egen
         kommentar) och behöver aldrig blockera HTML-parsningen/första
         målningen för att hinna köras. Ordningsgarantin ovan håller ändå —
         en `defer`-tagg och en `type="module"`-tagg (main.jsx nedan) körs
         BÅDA efter parsningen, i DOKUMENTORDNING sinsemellan, så den här
         hinner alltid före main.jsx precis som när den var blockerande. -->
    <script src="/consent-init.js" defer></script>
