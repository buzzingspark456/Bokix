<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Search Console-ägarverifiering (HTML-tagg-metoden) — bevisar
         att den här sajten faktiskt är bokix.se inför Google, krävs innan
         sitemapen (public/sitemap.xml) kan skickas in. Ta ALDRIG bort utan
         att verifiera i Search Console om domänen behöver verifieras om. -->
    <meta name="google-site-verification" content="3y6QgWaWZDle_daSlZfCE4BVn-nh6H-YSNOEsgfWJ-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- Google Search favicon-riktlinjer: minst 48×48, helst en multipel av
         48 — de äldre 16/32px-varianterna ovan (webbläsarflikens ikon) är
         för små för att Google ska plocka upp dem i sökresultatet (se
         skärmdumpen: bara en generisk jordglob visades istället för Bokix
         egen logga). 48/96 tillagda, INTE ersättande — webbläsare väljer
         själva lämpligaste storleken ur listan. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Bas-fallback för Open Graph/Twitter Card — täcker sidor som ännu
         inte satt egna taggar (t.ex. /privacy, /terms) samt det korta
         ögonblicket innan React hunnit montera och (för de fem marknads-
         sidorna) skriva över med sina egna via <PageMeta>, se
         src/utils/seo.jsx. React 19 hissar title/meta/link till <head> när
         de renderas i komponentträdet och skriver då över dessa på
         KLIENTEN — men scripts/prerender.mjs (SSG-byggsteget, körs efter
         `vite build`) ersätter hela blocket mellan markörerna nedan
         DIREKT I HTML:EN för de sex förrenderade marknadssidorna, så en
         crawler som aldrig kör JS ser rätt titel/beskrivning också. Rör
         ALDRIG start-/slutmarkörerna (BOKIX_SEO_META_START/END) — prerender-
         scriptet letar efter dem exakt. -->
    <!-- BOKIX_SEO_META_START -->
    <meta name="description" content="Bokix - Ett modernt, enkelt och kraftfullt bokföringsprogram för småföretagare och enskilda firmor." />
    <title>Bokix - Smart & Enkel Bokföring online</title>
    <link rel="canonical" href="https://www.bokix.se/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bokix" />
    <meta property="og:title" content="Bokix - Smart & Enkel Bokföring online" />
    <meta property="og:description" content="Bokix - Ett modernt, enkelt och kraftfullt bokföringsprogram för småföretagare och enskilda firmor." />
    <meta property="og:url" content="https://www.bokix.se/" />
    <meta property="og:image" content="https://www.bokix.se/icon-512.png" />
    <meta property="og:locale" content="sv_SE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bokix - Smart & Enkel Bokföring online" />
    <meta name="twitter:description" content="Bokix - Ett modernt, enkelt och kraftfullt bokföringsprogram för småföretagare och enskilda firmor." />
    <meta name="twitter:image" content="https://www.bokix.se/icon-512.png" />
    <!-- BOKIX_SEO_META_END -->
    <!-- Google Fonts som en riktig <link> med crossorigin, INTE ett @import
         i index.css — ett cross-origin @import gör att html2canvas (faktura-
         PDF/mejl-export) kastar en SecurityError när den försöker läsa
         stylesheetens cssRules, vilket i praktiken slog ut ALL styling från
         resten av index.css (samma fil) i den exporterade PDF:en/mejlbilagan,
         inte bara typsnittet. Googles /css2-endpoint skickar
         Access-Control-Allow-Origin, så en <link crossorigin> går att läsa
         utan att kasta. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Lighthouse (Prestanda, "Begäranden om renderingsblockering"): en
         vanlig <link rel="stylesheet"> här blockerar första målningen tills
         Google Fonts svarat. `media="print"` gör att webbläsaren laddar
         hem den PARALLELLT utan att blockera renderingen; /font-swap.js
         byter den till `all` så den faktiskt appliceras så fort den är
         klar — texten syns direkt i systemfallback-typsnittet
         (`&display=swap` i URL:en) och byter till Inter utan blockering.
         ETT inline onload="..."-attribut hade gjort exakt samma sak men
         bryter mot Content-Security-Policyn (vercel.json script-src har
         ingen 'unsafe-inline') — därav ett externt script istället, se
         dess egen kommentar, samma mönster som consent-init.js redan
         använder av samma skäl. `crossorigin` följer med rakt av så
         html2canvas fortfarande kan läsa cssRules utan SecurityError, se
         kommentaren ovan — bara LADDNINGEN är asynkron, inte CORS-
         beteendet. <noscript>-fallbacken täcker webbläsare utan JS
         (font-swap.js körs aldrig då). -->
    <link
      data-font-async
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet" crossorigin="anonymous" media="print"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" crossorigin="anonymous" />
    </noscript>
    <script src="/font-swap.js" defer></script>

    <!-- Google Analytics via Consent Mode v2 (Sida 37). Bugkritiskt: consent
         'default' med samtliga kategorier 'denied' MÅSTE köras innan 'config'
         — annars sätter gtag.js _ga/_gid-cookies och skickar mätdata redan
         vid sidladdning, innan besökaren hunnit svara i cookiebannern
         (src/components/CookieBanner.jsx), vilket bryter mot GDPR/ePrivacy.
         Bannern anropar gtag('consent','update',...) via
         src/utils/consent.js när besökaren faktiskt väljer.

         Själva gtag.js-scriptet (tidigare en egen <script async src="…">
         här) är flyttat IN i consent-init.js och fördröjt (Lighthouse:
         163.8 KiB, den största "oanvänd JavaScript"-posten) — se den
         filens egen kommentar för hela resonemanget och varför
         konsent-ordningen fortfarande garanterat håller.

         Extern fil, inte inline — se public/consent-init.js för varför
         (Content-Security-Policy, säkerhetsgranskningen). -->
    <script src="/consent-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
