<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bokix - Ett modernt, enkelt och kraftfullt bokföringsprogram för småföretagare och enskilda firmor." />
    <title>Bokix - Smart & Enkel Bokföring online</title>
    <!-- Google Fonts som en riktig <link> med crossorigin, INTE ett @import
         i index.css — ett cross-origin @import gör att html2canvas (faktura-
         PDF/mejl-export) kastar en SecurityError när den försöker läsa
         stylesheetens cssRules, vilket i praktiken slog ut ALL styling från
         resten av index.css (samma fil) i den exporterade PDF:en/mejlbilagan,
         inte bara typsnittet. Googles /css2-endpoint skickar
         Access-Control-Allow-Origin, så en <link crossorigin> går att läsa
         utan att kasta. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" crossorigin="anonymous" />

    <!-- Google Analytics via Consent Mode v2 (Sida 37). Bugkritiskt: consent
         'default' med samtliga kategorier 'denied' MÅSTE köras innan 'config'
         — annars sätter gtag.js _ga/_gid-cookies och skickar mätdata redan
         vid sidladdning, innan besökaren hunnit svara i cookiebannern
         (src/components/CookieBanner.jsx), vilket bryter mot GDPR/ePrivacy.
         Bannern anropar gtag('consent','update',...) via
         src/utils/consent.js när besökaren faktiskt väljer. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9KXP9XW3MW"></script>
    <!-- Extern fil, inte inline — se public/consent-init.js för varför
         (Content-Security-Policy, säkerhetsgranskningen). -->
    <script src="/consent-init.js"></script>

    <!-- Schema.org strukturerad data (samma innehåll som
         src/components/marketing/structuredData.js) — garanterad baslinje
         som finns kvar oavsett vilken sida en crawler faktiskt landar på,
         och oavsett om scripts/prerender.mjs lyckas skriva sina egna
         per-sida-varianter. Statisk text i denna fil bryts aldrig av att
         appens JS misslyckas att köra, vilket är precis vad sök- och
         AI-svarsmotorer (Google AI Overviews, Perplexity, ChatGPT/Claude
         med webbsökning) behöver för att kunna citera exakta fakta om
         Bokix (pris, vad som ingår) istället för att gissa. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Bokix",
      "alternateName": "Bokix bokföringsprogram",
      "url": "https://www.bokix.se",
      "logo": "https://www.bokix.se/icon-512.png",
      "description": "Bokix är ett svenskt, webbaserat bokföringsprogram (bokix.se) för småföretag och enskilda firmor — inte att förväxla med fondtickern BOKIX.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "support@bokix.se",
        "contactType": "customer support",
        "areaServed": "SE",
        "availableLanguage": ["Swedish"]
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Bokix",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "url": "https://www.bokix.se",
      "description": "Bokix är ett modernt, enkelt och kraftfullt bokföringsprogram för svenska småföretagare och enskilda firmor — löpande bokföring, fakturering, lönekörning och deklarationsunderlag i ett pris.",
      "offers": {
        "@type": "Offer",
        "price": "99",
        "priceCurrency": "SEK",
        "url": "https://www.bokix.se/priser",
        "description": "99 kr/mån exkl. moms, 30 dagar gratis, ingen bindningstid."
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
